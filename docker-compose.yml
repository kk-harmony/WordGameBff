services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mainuser
      POSTGRES_PASSWORD: ${QUARKUS_DATASOURCE_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
      - ./docker/02-init-bff-store.sql:/docker-entrypoint-initdb.d/02-init-bff-store.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mainuser"]
      interval: 5s
      timeout: 5s
      retries: 5

  wordgames:
    build:
      context: ${WORDGAMES_BUILD_CONTEXT:-../../learningProjects/wordgames}
      dockerfile: src/main/docker/Dockerfile.jvm
    expose:
      - "8081"
    environment:
      QUARKUS_PROFILE: prod
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/wordgame
      QUARKUS_DATASOURCE_USERNAME: mainuser
      QUARKUS_DATASOURCE_PASSWORD: ${QUARKUS_DATASOURCE_PASSWORD:-change-me}
      QUARKUS_HTTP_PORT: 8081
      OIDC_AUTH_SERVER_URL: ${OIDC_AUTH_SERVER_URL:-https://customauth.fly.dev/}
      OIDC_CLIENT_ID: ${CUSTOMAUTH__CLIENTID}
      OIDC_CLIENT_SECRET: ${CUSTOMAUTH__CLIENTSECRET}
      OIDC_TOKEN_AUDIENCE: ${OIDC_TOKEN_AUDIENCE:-resource_server}
      BFF_CLIENT_ID: ${CUSTOMAUTH__CLIENTID}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/q/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  wordgamebff:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WORDGAMEBFF_HTTP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      GameApi__BaseUrl: http://wordgames:8081
      CustomAuth__Authority: ${CUSTOMAUTH__AUTHORITY:-https://customauth.fly.dev/}
      CustomAuth__ClientId: ${CUSTOMAUTH__CLIENTID}
      CustomAuth__ClientSecret: ${CUSTOMAUTH__CLIENTSECRET}
      CustomAuth__Audience: ${CUSTOMAUTH__AUDIENCE:-wordgame}
      Session__SigningKey: ${SESSION__SIGNINGKEY:-local-docker-compose-bff-signing-key-32chars!}
      Session__ExpiryMinutes: ${SESSION__EXPIRYMINUTES:-60}
      Pow__DifficultyBits: ${POW__DIFFICULTYBITS:-20}
      Pow__ChallengeExpirySeconds: ${POW__CHALLENGEEXPIRYSECONDS:-300}
      Cors__AllowedOrigins__0: ${CORS__ALLOWEDORIGINS__0:-http://localhost:3000}
      Cors__AllowedOrigins__1: ${CORS__ALLOWEDORIGINS__1:-http://localhost:5173}
      Realtime__Transport: SignalR
      Realtime__BackplaneType: PostgreSQL
      Realtime__Backplane__ConnectionString: Host=db;Port=5432;Database=wordgamebff;Username=mainuser;Password=${QUARKUS_DATASOURCE_PASSWORD:-change-me}
      Stores__Type: PostgreSQL
    depends_on:
      db:
        condition: service_healthy
      wordgames:
        condition: service_healthy

  wordgamebff2:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      GameApi__BaseUrl: http://wordgames:8081
      CustomAuth__Authority: ${CUSTOMAUTH__AUTHORITY:-https://customauth.fly.dev/}
      CustomAuth__ClientId: ${CUSTOMAUTH__CLIENTID}
      CustomAuth__ClientSecret: ${CUSTOMAUTH__CLIENTSECRET}
      CustomAuth__Audience: ${CUSTOMAUTH__AUDIENCE:-wordgame}
      Session__SigningKey: ${SESSION__SIGNINGKEY:-local-docker-compose-bff-signing-key-32chars!}
      Realtime__Transport: SignalR
      Realtime__BackplaneType: PostgreSQL
      Realtime__Backplane__ConnectionString: Host=db;Port=5432;Database=wordgamebff;Username=mainuser;Password=${QUARKUS_DATASOURCE_PASSWORD:-change-me}
      Stores__Type: PostgreSQL
    depends_on:
      db:
        condition: service_healthy
      wordgames:
        condition: service_healthy
    profiles:
      - multi-instance

  embed:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8082:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  pgdata:

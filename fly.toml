app = "wordgamebff"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  Realtime__Transport = "SignalR"
  Realtime__BackplaneType = "PostgreSQL"
  Stores__Type = "PostgreSQL"
  POW__DIFFICULTYBITS = "20"
  POW__CHALLENGEEXPIRYSECONDS = "300"
  # Non-secrets (CustomAuth pattern): URLs / CORS / public OIDC settings live here.
  GameApi__BaseUrl = "https://wordgames-api.fly.dev"
  GameApi__WarmupPath = "/q/health/live"
  CustomAuth__Authority = "https://customauth.fly.dev/"
  CustomAuth__Audience = "wordgame"
  Session__Issuer = "wordgamebff"
  Session__ExpiryMinutes = "60"
  # Embed CDN + host app. Localhost so a host running locally can call this BFF.
  Cors__AllowedOrigins__0 = "https://wordgameui.netlify.app"
  Cors__AllowedOrigins__1 = "https://nepalishabda.netlify.app"
  Cors__AllowedOrigins__2 = "http://localhost:5173"
  Cors__AllowedOrigins__3 = "http://localhost:3000"
  Cors__AllowedOrigins__4 = "http://127.0.0.1:5173"
  Cors__AllowedOrigins__5 = "http://127.0.0.1:3000"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 2
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 500
    soft_limit = 400

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/health/ready"
    timeout = "5s"

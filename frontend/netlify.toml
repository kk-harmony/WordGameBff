[build]
  command = "npm ci && npm run build && npm run sri && npm run check:bundle-size"
  publish = "dist/embed"

[[headers]]
  for = "/v*/embed.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/v*/sri.txt"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

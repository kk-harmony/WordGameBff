server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/javascript text/plain text/css application/json;
    gzip_min_length 256;

    location /health {
        default_type text/plain;
        return 200 'ok';
    }

    location ~ ^/v[0-9]+\.[0-9]+\.[0-9]+/embed\.js$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~ ^/v[0-9]+\.[0-9]+\.[0-9]+/sri\.txt$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# Deploys the embed CDN from frontend/ to Netlify.
#
# Required GitHub repository secrets:
#   NETLIFY_AUTH_TOKEN — Netlify personal access token
#   NETLIFY_SITE_ID — Netlify site API ID

name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build embed
        run: npm ci && npm run build && npm run sri && npm run check:bundle-size

      - name: Deploy to Netlify
        run: |
          npx --yes netlify-cli@23.9.1 deploy \
            --prod \
            --dir=dist/embed \
            --filter=@wordgame/embed \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --message "github:${GITHUB_SHA}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          CI: true
          NETLIFY_CLI_TELEMETRY_DISABLED: '1'

name: Frontend CI

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: npm run check:bundle-size

      - name: Generate SRI hash
        run: npm run sri

  e2e:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright
        working-directory: frontend/apps/e2e
        run: npx playwright install chromium --with-deps

      - name: Start stack
        working-directory: .
        run: |
          docker compose up --build -d wordgamebff embed db wordgames
          timeout 180 bash -c 'until curl -sf http://localhost:8080/health; do sleep 3; done'
          timeout 60 bash -c 'until curl -sf http://localhost:8082/health; do sleep 3; done'

      - name: Start playground
        working-directory: frontend
        run: npm run dev &
        env:
          VITE_API_BASE: http://localhost:8080
          VITE_EMBED_CDN: http://localhost:8082

      - name: Wait for playground
        run: timeout 60 bash -c 'until curl -sf http://localhost:5173; do sleep 2; done'

      - name: E2E tests
        working-directory: frontend
        run: npm run test:e2e
        env:
          BFF_URL: http://localhost:8080
          PLAYWRIGHT_BASE_URL: http://localhost:5173

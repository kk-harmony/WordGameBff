name: Frontend CI

on:
  push:
    paths:
      - 'frontend/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'docker-compose.ci.yml'
      - 'Dockerfile'
      - 'scripts/ci-*.sh'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'docker-compose.ci.yml'
      - 'Dockerfile'
      - 'scripts/ci-*.sh'
      - '.github/workflows/frontend-ci.yml'

defaults:
  run:
    working-directory: frontend

env:
  WORDGAMES_REF: cfe8bed6b34548fbd79e11a18d409d68f4bbecf7
  WORDGAMES_BUILD_CONTEXT: ./wordgames

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate and build
        run: npm run build

      - name: Check bundle size
        run: npm run check:bundle-size

      - name: Generate SRI hash
        run: npm run sri

  smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Check out wordgames service
        uses: actions/checkout@v4
        with:
          repository: kk-harmony/wordgames
          path: wordgames
          ref: ${{ env.WORDGAMES_REF }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: frontend/apps/e2e
        run: npx playwright install chromium --with-deps

      - name: Start stack
        working-directory: .
        run: ./scripts/ci-start-hermetic-stack.sh

      - name: Start playground
        working-directory: frontend
        run: npm run dev &
        env:
          VITE_API_BASE: http://localhost:8180
          VITE_EMBED_CDN: http://localhost:8083

      - name: Wait for playground
        run: timeout 60 bash -c 'until curl -sf http://localhost:5174; do sleep 2; done'

      - name: Smoke E2E
        working-directory: frontend
        run: npm run test:e2e:smoke
        env:
          BFF_URL: http://localhost:8180
          PLAYWRIGHT_BASE_URL: http://localhost:5174
          REQUIRE_FULL_STACK: 'true'

      - name: Show stack diagnostics
        if: failure()
        working-directory: .
        run: ./scripts/ci-dump-stack.sh

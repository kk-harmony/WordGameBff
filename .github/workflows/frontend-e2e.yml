# Full hermetic Playwright suite. Does not gate merges — run on schedule or manually.
name: Frontend E2E

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: frontend-e2e
  cancel-in-progress: true

env:
  WORDGAMES_REF: cfe8bed6b34548fbd79e11a18d409d68f4bbecf7
  WORDGAMES_BUILD_CONTEXT: ./wordgames

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out wordgames service
        uses: actions/checkout@v4
        with:
          repository: kk-harmony/wordgames
          path: wordgames
          ref: ${{ env.WORDGAMES_REF }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: frontend/apps/e2e
        run: npx playwright install chromium --with-deps

      - name: Start stack
        run: ./scripts/ci-start-hermetic-stack.sh

      - name: Start playground
        working-directory: frontend
        run: npm run dev &
        env:
          VITE_API_BASE: http://localhost:8080
          VITE_EMBED_CDN: http://localhost:8082

      - name: Wait for playground
        run: timeout 60 bash -c 'until curl -sf http://localhost:5173; do sleep 2; done'

      - name: Full E2E suite
        working-directory: frontend
        run: npm run test:e2e
        env:
          BFF_URL: http://localhost:8080
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          REQUIRE_FULL_STACK: 'true'

      - name: Show stack diagnostics
        if: failure()
        run: ./scripts/ci-dump-stack.sh

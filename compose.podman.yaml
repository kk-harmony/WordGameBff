# Podman local stack: wordgames + WordGameBff + HTML demo against host PostgreSQL.
# Run via: ./scripts/run-podman-local.sh
# CustomAuth: production https://customauth.fly.dev/ only (no mocks).

services:
  wordgames:
    build:
      context: ${WORDGAMES_BUILD_CONTEXT:-../../learningProjects/wordgames}
      dockerfile: src/main/docker/Dockerfile.jvm
    expose:
      - "8081"
    extra_hosts:
      - "host.containers.internal:host-gateway"
    environment:
      QUARKUS_PROFILE: prod
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://${POSTGRES_HOST:-host.containers.internal}:${POSTGRES_PORT:-5432}/wordgame
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:-mainuser}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      QUARKUS_HTTP_PORT: 8081
      OIDC_AUTH_SERVER_URL: ${OIDC_AUTH_SERVER_URL:-https://customauth.fly.dev/}
      OIDC_CLIENT_ID: ${CUSTOMAUTH__CLIENTID:-wordgamebff}
      OIDC_CLIENT_SECRET: ${CUSTOMAUTH__CLIENTSECRET}
      OIDC_TOKEN_AUDIENCE: ${OIDC_TOKEN_AUDIENCE:-resource_server}
      BFF_CLIENT_ID: ${CUSTOMAUTH__CLIENTID:-wordgamebff}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/q/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      io.podman.compose.project: wordgamebff-local

  wordgamebff:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WORDGAMEBFF_HTTP_PORT:-8080}:8080"
    extra_hosts:
      - "host.containers.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      GameApi__BaseUrl: http://wordgames:8081
      CustomAuth__Authority: ${CUSTOMAUTH__AUTHORITY:-https://customauth.fly.dev/}
      CustomAuth__ClientId: ${CUSTOMAUTH__CLIENTID}
      CustomAuth__ClientSecret: ${CUSTOMAUTH__CLIENTSECRET}
      CustomAuth__Audience: ${CUSTOMAUTH__AUDIENCE:-wordgame}
      Session__SigningKey: ${SESSION__SIGNINGKEY:-change-me-to-a-long-random-string-at-least-32-chars}
      Session__ExpiryMinutes: ${SESSION__EXPIRYMINUTES:-60}
      Session__Issuer: ${SESSION__ISSUER:-wordgamebff}
      Pow__DifficultyBits: ${POW__DIFFICULTYBITS:-20}
      Pow__ChallengeExpirySeconds: ${POW__CHALLENGEEXPIRYSECONDS:-300}
      Cors__AllowedOrigins__0: ${CORS__ALLOWEDORIGINS__0:-http://localhost:3000}
      Cors__AllowedOrigins__1: ${CORS__ALLOWEDORIGINS__1:-http://localhost:5173}
      Realtime__Transport: SignalR
      Realtime__BackplaneType: PostgreSQL
      Realtime__Backplane__ConnectionString: Host=${POSTGRES_HOST:-host.containers.internal};Port=${POSTGRES_PORT:-5432};Database=wordgamebff;Username=${POSTGRES_USER:-mainuser};Password=${POSTGRES_PASSWORD:-change-me}
      Stores__Type: ${STORES__TYPE:-PostgreSQL}
    depends_on:
      wordgames:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      io.podman.compose.project: wordgamebff-local

  demo:
    image: docker.io/library/nginx:alpine
    ports:
      - "${DEMO_HTTP_PORT:-3000}:80"
    volumes:
      - ./local:/usr/share/nginx/html:ro
      - ./local/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      wordgamebff:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    labels:
      io.podman.compose.project: wordgamebff-local
